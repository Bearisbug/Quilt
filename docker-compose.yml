# 仅仓库内开发用：想直接用 psql 查库时起这个 Postgres 并在 .env 设 DATABASE_URL。
# 打包运行（npx quilt-canvas）不需要 Docker，DATABASE_URL 留空即用内置 PGlite（ADR-010 v0.32）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: quilt-pg
    # 慢查询排查（§21 v1.29）：pg_stat_statements 记每类语句的累计耗时，≥ 200 ms 的语句进容器日志；扩展要在库里建一次。
    # 日志行带时间、进程号与库名（§21 v1.42）：开发库与各条测试库共用这一个容器，没有库名分不清是谁的慢查询
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=200", "-c", "log_line_prefix=%m [%p] %d "]
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_DB: quilt
      POSTGRES_USER: quilt
      POSTGRES_PASSWORD: quilt
    volumes:
      - quilt-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quilt -d quilt"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  quilt-pg-data:
