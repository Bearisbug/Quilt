<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/brand/symbol-graphite.svg" />
    <!-- 外观（REQ-CORE-039，INT-021）：样式表之前把选过的模式写到 <html data-theme>，第一帧就是这个模式；
         跟随系统时不写，由 tokens.css 的 prefers-color-scheme 层接管。键名与写法同 src/lib/theme.ts -->
    <script>try { var t = localStorage.getItem('quilt:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
    <!-- 样式表用 <link> 引：开发形态下也阻塞首帧，刷新时不先画一帧没有样式的底色 -->
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Quilt</title>
    <meta name="description" content="Quilt 是 AI 原生的无限画布设计工具：用自然语言生成多屏 HTML 界面，在画布里组织、迭代并连接为可交互原型。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
